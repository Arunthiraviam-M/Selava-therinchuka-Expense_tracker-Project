<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selava Therinchuka 💰 – Login</title>
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="auth-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="auth-container">
    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="#6C63FF"/>
          <path d="M8 18L13 10L17 15L20 11" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20" cy="11" r="2" fill="#A8FF78"/>
        </svg>
      </div>
      <span class="brand-name">Selava Therinchuka 💰</span>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Track every rupee, own every decision.</p>
      </div>

      <div id="error-banner" class="error-banner hidden">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#FF6B6B" stroke-width="1.5"/><path d="M8 5v4M8 11v.5" stroke="#FF6B6B" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span id="error-text">Invalid email or password.</span>
      </div>

      <form id="login-form" novalidate>
        <div class="field-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12v9H2V4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M2 4l6 5 6-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" onclick="togglePassword('password', this)">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <button type="submit" class="btn-primary" id="login-btn">
          <span class="btn-text">Sign in</span>
          <div class="btn-spinner hidden"></div>
        </button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
