<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selava Therinchuka 💰 – Create Account</title>
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="auth-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="auth-container">
    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="#6C63FF"/>
          <path d="M8 18L13 10L17 15L20 11" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20" cy="11" r="2" fill="#A8FF78"/>
        </svg>
      </div>
      <span class="brand-name">Selava Therinchuka 💰</span>
    </div>

    <div class="auth-card register-card">
      <div class="auth-header">
        <h1>Create account</h1>
        <p>Start mastering your finances today.</p>
      </div>

      <div id="error-banner" class="error-banner hidden">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#FF6B6B" stroke-width="1.5"/><path d="M8 5v4M8 11v.5" stroke="#FF6B6B" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span id="error-text">Something went wrong.</span>
      </div>

      <form id="register-form" novalidate>
        <div class="form-row">
          <div class="field-group">
            <label for="name">Full Name</label>
            <div class="input-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M2 14c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <input type="text" id="name" placeholder="Arjun Sharma" required />
            </div>
            <span class="field-error" id="name-error"></span>
          </div>

          <div class="field-group">
            <label for="age">Age</label>
            <div class="input-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 1v3M11 1v3M2 7h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <input type="number" id="age" placeholder="25" min="13" max="120" required />
            </div>
            <span class="field-error" id="age-error"></span>
          </div>
        </div>

        <div class="field-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12v9H2V4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M2 4l6 5 6-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input type="password" id="password" placeholder="Min. 6 characters" required />
            <button type="button" class="toggle-pw" onclick="togglePassword('password', this)">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <div class="field-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input type="password" id="confirm-password" placeholder="Repeat password" required />
            <button type="button" class="toggle-pw" onclick="togglePassword('confirm-password', this)">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>
          <span class="field-error" id="confirm-password-error"></span>
        </div>

        <button type="submit" class="btn-primary" id="register-btn">
          <span class="btn-text">Create account</span>
          <div class="btn-spinner hidden"></div>
        </button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="index.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
